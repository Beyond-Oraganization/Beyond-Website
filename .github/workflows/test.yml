name: Test the site manager

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, integration and site tests
        run: sh manager/run_tests.sh
      - name: Generated pages match the config
        run: manager/bm build --check
      - name: Links, anchors, navigation and fonts
        run: manager/bm check
