<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyondia manager</title>
<style>
:root {
  --bg: #EDECE7; --surface: #F8F7F3; --surface2: #E4E3DD; --ink: #1E1E1C; --mute: #66665F; --line: #CFCEC6; --line2: #A9A89F;
  --accent: #1E1E1C; --accent-ink: #F8F7F3; --focus: #2B5BD7;
  --ok: #1F6A36; --bad: #A12626; --bad-bg: #F6DEDC; --warn: #8A6200; --warn-bg: #F4E8C4; --ok-bg: #DCEBDD;
  --f-t: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-r: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #181817; --surface: #222220; --surface2: #2C2C29; --ink: #ECEBE5; --mute: #A3A29A; --line: #3A3A36; --line2: #5A5A54;
    --accent: #ECEBE5; --accent-ink: #1E1E1C; --focus: #7DA2FF; --ok: #7BC98E; --bad: #FF8F86; --bad-bg: #3C2423; --warn: #E3BC5A; --warn-bg: #3A3220; --ok-bg: #213426; }
  html { color-scheme: dark; }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-r); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
[hidden] { display: none !important; }

/* --- frame --- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font: 700 14px/1 var(--f-t); letter-spacing: .1em; text-transform: uppercase; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 12px/1 var(--f-t); padding: 5px 8px; border-radius: 999px; background: var(--surface2); color: var(--mute); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.top .space { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.shell { display: grid; grid-template-columns: 188px minmax(0, 1fr) minmax(340px, 42%); min-height: calc(100vh - 53px); }
.shell.nopreview { grid-template-columns: 188px minmax(0, 1fr); }
.rail { padding: 16px 10px; border-right: 1px solid var(--line); position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px); }
.rail button { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; margin-bottom: 2px; }
.rail button:hover { background: var(--surface2); }
.rail button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.rail .n { font: 12px/1 var(--f-t); opacity: .7; }
.editor { padding: 24px clamp(16px, 3vw, 40px) 120px; min-width: 0; max-width: 860px; width: 100%; }
.preview { border-left: 1px solid var(--line); background: var(--surface2); display: flex; flex-direction: column; position: sticky; top: 53px; height: calc(100vh - 53px); }
.pbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; }
.pframe { flex: 1; display: flex; justify-content: center; overflow: auto; }
.pframe iframe { border: 0; background: #fff; width: 100%; height: 100%; }
.pframe.phone iframe { width: 390px; max-width: 100%; box-shadow: 0 0 0 1px var(--line2); }
@media (max-width: 1180px) {
  .shell, .shell.nopreview { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .rail button { width: auto; gap: 8px; margin: 0; }
  .preview { position: static; height: 80vh; border-left: 0; border-top: 1px solid var(--line); }
}

/* --- text --- */
h2 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font: 600 12px/1 var(--f-t); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); margin: 34px 0 12px; display: flex; align-items: center; gap: 10px; }
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hint { color: var(--mute); font-size: 13.5px; margin: 0 0 14px; }
.meta { font: 12px/1.45 var(--f-t); color: var(--mute); overflow-wrap: anywhere; }
.empty { border: 1px dashed var(--line2); border-radius: var(--r); padding: 18px; color: var(--mute); text-align: center; }

/* --- controls --- */
.btn { border: 1px solid var(--line2); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--bad-bg); }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover:not(:disabled) { background: var(--surface2); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
label .req { color: var(--bad); margin-left: 3px; }
label .count { float: right; font: 400 11.5px/1.6 var(--f-t); color: var(--mute); }
input[type=text], textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
textarea.body { min-height: 52vh; font: 14px/1.65 var(--f-t); tab-size: 2; }
.fhint { color: var(--mute); font-size: 12.5px; margin: 4px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
.err { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); border-radius: 6px; padding: 10px 12px; margin: 12px 0 0; white-space: pre-wrap; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 10px 12px; margin: 12px 0 0; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; } @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

/* --- rows --- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; }
.row.hidden { background: transparent; border-style: dashed; }
.row.hidden .title { color: var(--mute); }
.row .head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 8px; }
.row .grip { border: 0; background: transparent; color: var(--mute); cursor: grab; padding: 6px 4px; font-size: 16px; letter-spacing: -2px; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.badge { font: 11px/1 var(--f-t); padding: 3px 6px; border-radius: 4px; background: var(--surface2); color: var(--mute); margin-left: 6px; vertical-align: middle; }
.badge.draft { background: var(--warn-bg); color: var(--warn); }
.row.dragging { opacity: .4; }
.row.drop-before { box-shadow: 0 -3px 0 var(--focus); } .row.drop-after { box-shadow: 0 3px 0 var(--focus); }
.row .body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.row .confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--bad-bg); color: var(--bad); border-top: 1px solid var(--bad); border-radius: 0 0 var(--r) var(--r); font-size: 14px; }
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 18px; line-height: 1; color: var(--mute); }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu > summary:hover, details.menu[open] > summary { background: var(--surface2); }
details.menu .pop { position: absolute; right: 0; top: 100%; z-index: 10; min-width: 190px; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; display: flex; flex-direction: column; }
details.menu .pop button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 5px; cursor: pointer; }
details.menu .pop button:hover:not(:disabled) { background: var(--surface2); } details.menu .pop button:disabled { opacity: .4; cursor: not-allowed; }
details.menu .pop .bad { color: var(--bad); }
details.add { border: 1px dashed var(--line2); border-radius: var(--r); margin-top: 10px; background: transparent; }
details.add[open] { background: var(--surface); border-style: solid; border-color: var(--line); }
details.add > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; list-style: none; }
details.add > summary::-webkit-details-marker { display: none; }
details.add > div { padding: 0 14px 14px; }
.lanehead { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 8px 8px 8px 14px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.lanehead .meta { color: inherit; opacity: .7; }
.lanehead .btn { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 40%, transparent); }
ul.checks { list-style: none; padding: 0; margin: 8px 0 0; } ul.checks li { padding: 4px 0; } .ok-t { color: var(--ok); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
pre { background: var(--surface2); border-radius: var(--r); padding: 12px; overflow: auto; font: 12.5px/1.55 var(--f-t); margin: 12px 0 0; white-space: pre-wrap; }
details.guide { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); } details.guide > summary { padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
details.guide table { border-collapse: collapse; margin: 0 12px 12px; font-size: 13.5px; width: calc(100% - 24px); } details.guide td { padding: 5px 12px 5px 0; vertical-align: top; border-top: 1px solid var(--line); } details.guide code { font: 12.5px var(--f-t); background: var(--surface2); padding: 1px 5px; border-radius: 4px; }
.sticky { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 28%); padding: 22px 0 14px; margin-top: 8px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 40; width: min(640px, calc(100vw - 24px)); }
#toast .t { display: flex; gap: 12px; align-items: center; background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: 14px; white-space: pre-wrap; }
#toast .t.bad { background: var(--bad); color: #fff; }
#toast .t span { flex: 1; } #toast .t .btn { background: transparent; color: inherit; border-color: color-mix(in srgb, currentColor 50%, transparent); padding: 3px 10px; }
@media (prefers-reduced-motion: no-preference) { .btn, .row, .rail button { transition: background-color .12s, opacity .12s, box-shadow .12s; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Beyondia manager</span>
  <div class="chips" id="chips" aria-live="polite"></div>
  <div class="space">
    <span class="chip warn" id="dirty" hidden>● Unsaved typing</span>
    <button class="btn" id="undo" disabled title="Undo the last change">↶ Undo</button>
    <button class="btn" id="ptoggle" aria-pressed="true">Preview</button>
  </div>
</header>
<div class="shell" id="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="editor" id="panel"></main>
  <aside class="preview" id="preview" aria-label="Live preview">
    <div class="pbar" id="pbar"></div>
    <div class="pframe" id="pframe"><iframe id="frame" title="Site preview"></iframe></div>
  </aside>
</div>
<datalist id="statuses"></datalist>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = "__BM_TOKEN__";
const TABS = [["home", "Home"], ["doors", "Doors"], ["stories", "Stories"], ["blog", "Blog"], ["plans", "Plans"], ["github", "GitHub"], ["publish", "Publish"]];
const PAGE_OF_TAB = { home: "index.html", doors: "index.html", stories: "stories.html", blog: "blog.html", plans: "plans.html", github: "github.html" };
const PREVIEW_PAGES = [["index.html", "Home"], ["stories.html", "Stories"], ["blog.html", "Blog"], ["plans.html", "Plans"], ["github.html", "GitHub"]];
const STATUSES = ["Live", "In progress", "Planned", "Next", "Tomorrow", "Open", "Done", "Paused"];
const ui = {
  tab: "home", open: new Set(), confirming: null, drafts: {}, dirty: new Set(), formError: {}, busy: false,
  story: null,                       // null = the list; an id = editing that story; "+" = writing a new one
  post: null,                        // the same for the blog
  previewOpen: window.innerWidth >= 1180, previewPage: "index.html", phone: false, publish: null, message: "", focus: null,
};
let state = null;

/* ================= helpers ================= */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  if (value !== undefined) el.value = value;
  return el;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const trim = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s);
const csv = s => s.split(",").map(x => x.trim()).filter(Boolean);
const slugify = t => t.toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
const todayLocal = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); };
const wordsIn = t => (t.trim() ? t.trim().split(/\s+/).length : 0);

const NAMES = { body: "Story text", paras: "Verse text", ref: "Verse number", visible: "Visibility", kids: "Rooms line", href: "Link", url: "GitHub link", stack: "Stack", aside: "Side note", when: "When" };
/* Turn "  - home.map.tiles[0].title: must not be empty" into "Title (item 1): must not be empty". */
function friendly(message) {
  return message.replace("the change would make the config invalid:", "That cannot be saved:").split("\n").map(line => {
    const m = line.match(/^\s*-\s*([\w.\[\]]+):\s*(.*)$/);
    if (!m) return line;
    const parts = m[1].split(".");
    const raw = parts[parts.length - 1].replace(/\[\d+\]/g, "");
    const last = (raw === "body" && m[1].startsWith("blog.")) ? "Post text" : (NAMES[raw] || raw.replace(/_/g, " "));
    const idx = [...m[1].matchAll(/\[(\d+)\]/g)].map(x => Number(x[1]) + 1);
    return "• " + cap(last) + (idx.length ? " (item " + idx.join(", ") + ")" : "") + ": " + m[2];
  }).join("\n");
}

/* ================= server ================= */
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-BM-Token": TOKEN }, body: JSON.stringify(body || {}) });
  const data = await res.json().catch(() => ({ ok: false, error: "The server sent an unreadable answer." }));
  if (!data.ok) throw new Error(data.error || "Request failed.");
  return data;
}
async function load() {
  const data = await (await fetch("/api/state")).json();
  if (!data.ok) throw new Error(data.error);
  state = data;
}
function toast(text, opts = {}) {
  const box = document.getElementById("toast");
  box.replaceChildren();
  const note = h("div", { class: "t" + (opts.bad ? " bad" : "") }, h("span", { text }),
    opts.undo ? h("button", { class: "btn", onclick: () => { box.replaceChildren(); undo(); }, text: "Undo" }) : null,
    h("button", { class: "btn", "aria-label": "Dismiss", onclick: () => box.replaceChildren(), text: "✕" }));
  box.append(note);
  if (!opts.bad) setTimeout(() => { if (note.parentNode === box) box.replaceChildren(); }, opts.undo ? 7000 : 3500);
}

/* One entry point for every change: typed text is kept on failure and cleared on success. */
async function act(op, params, o = {}) {
  if (ui.busy) return false;
  ui.busy = true;
  try {
    state = await post("/api/edit", { op, params });
    ui.busy = false;
    if (o.clear) clearDrafts(o.clear);
    if (o.form) { delete ui.formError[o.form]; if (o.closeForm !== false) ui.open.delete(o.form); }
    render(); reloadPreview();
    if (o.ok) toast(o.ok, { undo: true });
    return true;
  } catch (e) {
    ui.busy = false;
    const text = friendly(e.message);
    if (o.form) { ui.formError[o.form] = text; render(); } else { render(); toast(text, { bad: true }); }
    return false;
  }
}
async function undo() {
  if (ui.busy) return;
  ui.busy = true;
  try { state = await post("/api/undo", {}); ui.busy = false; render(); reloadPreview(); toast("Undone."); }
  catch (e) { ui.busy = false; render(); toast(friendly(e.message), { bad: true }); }
}

/* ================= drafts: what you typed survives errors and tab changes ================= */
function clearDrafts(prefix) {
  for (const k of Object.keys(ui.drafts)) if (k === prefix || k.startsWith(prefix + ":")) { delete ui.drafts[k]; ui.dirty.delete(k); }
  updateDirty();
}
function updateDirty() {
  document.getElementById("dirty").hidden = ui.dirty.size === 0;
  for (const [id, prefix] of [["story-dirty", "story:"], ["post-dirty", "post:"]]) {
    const line = document.getElementById(id);
    if (line) line.textContent = [...ui.dirty].some(k => k.startsWith(prefix)) ? "● Unsaved changes · Ctrl+S saves" : "No unsaved changes";
  }
}
window.addEventListener("beforeunload", e => { if (ui.dirty.size) { e.preventDefault(); e.returnValue = ""; } });

let uid = 0;
/* spec: {name, label, value, key, max, area, list, placeholder, hint, required, options, body, rows, onInput} */
function field(spec) {
  const id = "f" + (++uid), key = spec.key;
  const original = spec.value == null ? "" : String(spec.value);
  const start = key && ui.drafts[key] !== undefined ? ui.drafts[key] : original;
  const common = { id, maxlength: spec.max, placeholder: spec.placeholder, "data-fkey": key };
  let input;
  if (spec.options) input = h("select", common, spec.options.map(([v, l]) => h("option", { value: v, text: l })));
  else if (spec.area) input = h("textarea", { ...common, class: spec.body ? "body" : "", spellcheck: "true", rows: spec.rows });
  else input = h("input", { ...common, type: spec.type || "text", list: spec.list ? "statuses" : null, autocomplete: "off" });
  input.value = start;
  const count = spec.max ? h("span", { class: "count" }) : null;
  const refresh = () => { if (count) count.textContent = input.value.length + " / " + spec.max; };
  const remember = () => {
    if (key) { ui.drafts[key] = input.value; input.value !== original ? ui.dirty.add(key) : ui.dirty.delete(key); updateDirty(); }
    refresh();
    if (spec.onInput) spec.onInput(input.value);
  };
  input.addEventListener("input", remember);
  input.addEventListener("change", remember);
  refresh();
  if (key && start !== original) ui.dirty.add(key);
  const el = h("div", {}, h("label", { for: id }, spec.label, spec.required ? h("span", { class: "req", text: "*" }) : null, count), input,
    spec.hint ? h("p", { class: "fhint", text: spec.hint }) : null);
  return { el, input, name: spec.name, original, get: () => input.value, set: v => { input.value = v; remember(); } };
}
const collect = fields => Object.fromEntries(fields.map(f => [f.name, f.get()]));
const changed = fields => Object.fromEntries(fields.filter(f => f.get() !== f.original).map(f => [f.name, f.get()]));
const errorBox = key => (ui.formError[key] ? h("div", { class: "err", role: "alert", text: ui.formError[key] }) : null);

/* A form with a Save button for a fixed set of fields (Home, Plans, GitHub page text...). */
function pageForm({ key, specs, op, ok, label }) {
  const fields = specs.map(s => field({ ...s, key: key + ":" + s.name }));
  const save = () => { const c = changed(fields); if (!Object.keys(c).length) return toast("Nothing changed."); act(op, c, { form: key, clear: key, ok, closeForm: false }); };
  const box = h("div", { "data-saveform": "1" }, errorBox(key), fields.map(f => f.el), h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: save, text: label })));
  box._save = save;
  return box;
}

/* An inline editor for one item: Save / Cancel, Enter saves, Esc closes. */
function inlineEditor({ key, specs, onSave }) {
  const fields = specs.map(s => field({ ...s, key: key + ":" + s.name }));
  const save = () => { const c = changed(fields); if (!Object.keys(c).length) return toast("Nothing changed."); onSave(c, key); };
  const close = () => { ui.open.delete(key); delete ui.formError[key]; clearDrafts(key); render(); };
  const box = h("div", { class: "body", "data-saveform": "1" }, errorBox(key), fields.map(f => f.el),
    h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: save, text: "Save" }), h("button", { class: "btn", onclick: close, text: "Cancel" })));
  box._save = save;
  box.addEventListener("keydown", e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); save(); }
  });
  if (ui.focus === key) ui.focus = key + ":" + specs[0].name;   // focus the first field when the editor has just been opened
  return box;
}

/* A collapsed "+ Add ..." form whose typing is kept if the server refuses it. */
function addForm({ key, title, specs, onSubmit, disabledReason }) {

    h("div", { class: "actions" }, h("button", { class: "btn primary", disabled: !!disabledReason, onclick: submit, text: "Add" })));
  inner._save = submit;
  const box = h("details", { class: "add", open: ui.open.has(key) }, h("summary", { text: "+ " + title }), inner);
  box.addEventListener("toggle", () => {
    box.open ? ui.open.add(key) : ui.open.delete(key);
    if (box.open) { const f = box.querySelector("input,textarea"); if (f && !f.value) f.focus(); }
  });
  box.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); submit(); } });

function sortable(container, onMove) {

  container.addEventListener("dragover", e => {
    if (from === null) return; e.preventDefault();
    const c = e.target.closest("[data-index]");
    if (c && Number(c.dataset.index) !== from) { const r = c.getBoundingClientRect(); mark(c, e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after"); }
  });
  container.addEventListener("drop", e => {
    if (from === null) return; e.preventDefault();
    const c = e.target.closest("[data-index]"); if (!c) return;
    const at = Number(c.dataset.index) + (c.classList.contains("drop-after") ? 1 : 0);
    const to = at > from ? at - 1 : at, f = from;
    from = null; mark(null);
    if (to !== f) onMove(f, to + 1);
  });
  container.addEventListener("dragend", () => { from = null; mark(null); container.querySelectorAll(".dragging").forEach(c => c.classList.remove("dragging")); });
}

        { label: "Remove…", danger: true, onClick: () => { ui.confirming = key; render(); } }],

}

/* ================= Blog ================= */
const POST_GUIDE = [
  ["A paragraph", "Just write it. Leave a blank line between paragraphs.", false],

];
const postDirty = () => dirtyIn("post");

function renderBlog() {
  if (ui.post) return renderPostEditor();

  const page = pageForm({ key: "blog", op: "blog.set", ok: "Blog page saved.", label: "Save", specs: [

        { label: p.visible ? "Make a draft (removes its page)" : "Publish", onClick: () => act("post.visible", { post_id: p.id, visible: !p.visible }, { ok: p.visible ? "Now a draft: its page is removed." : "Published." }) },
        { label: "Remove…", danger: true, onClick: () => { ui.confirming = k; render(); } }],

}
function openPost(id) {

    touched = idField.get() !== "" && idField.get() !== slugify(ui.drafts["post:title"] || "");

/* ================= Publish ================= */
function renderPublish() {
  const s = state.status, out = [h("h2", { text: "Publish" }), h("p", { class: "hint", text: "Commits only the files this tool manages, then pushes them to GitHub. Nothing is ever forced." })];
  const line = (ok, text) => h("li", { class: ok ? "ok-t" : "bad-t", text: (ok ? "✓ " : "✗ ") + text });
  if (!s.valid) { out.push(h("ul", { class: "checks" }, line(false, "The config is invalid")), h("pre", { text: s.problems.join("\n") })); return out; }
  const items = [line(true, "Config is valid"), line(!s.stale.length, s.stale.length ? "Pages out of date: " + s.stale.join(", ") : "Pages match the config"),
    line(!s.site_problems.length, s.site_problems.length ? "Site checks found " + s.site_problems.length + " problem(s)" : "Site checks pass (links, anchors, navigation, fonts)")];
  if (!s.git) items.push(h("li", { class: "warn-t", text: "! This folder is not a Git repository, so it cannot be published." }));
  else {
    items.push(line(s.git.origin, s.git.origin ? "Remote “origin” is set" : "No remote named “origin”"));
    items.push(line(!!s.git.branch, s.git.branch ? "On branch " + s.git.branch : "Not on a branch (detached HEAD)"));
    items.push(h("li", { text: s.git.changed.length ? "To publish: " + s.git.changed.join(", ") : "Nothing to publish" }));
  }
  out.push(h("ul", { class: "checks" }, items));
  if (s.site_problems.length) out.push(h("pre", { text: s.site_problems.join("\n") }));
  if (s.stale.length) out.push(h("div", { class: "actions" }, h("button", { class: "btn", onclick: async () => { try { state = await post("/api/build"); render(); reloadPreview(); toast("Pages rebuilt."); } catch (e) { toast(friendly(e.message), { bad: true }); } }, text: "Rebuild pages" })));
  const ready = s.git && s.git.origin && s.git.branch && !s.site_problems.length;
  const msg = field({ name: "message", label: "Commit message", value: ui.message, max: 100, placeholder: "Describe the change, for example “Add the story Lighthouse”", required: true });
  msg.input.addEventListener("input", () => { ui.message = msg.get(); ui.confirming = null; });
  const doPublish = async dry => {
    if (ui.busy) return; ui.busy = true;
    try { const d = await post("/api/publish", { message: msg.get() || "(preview)", dry_run: dry }); state = d; ui.publish = d.publish; ui.busy = false; render(); if (!dry && d.publish.status === "published") toast("Published " + d.publish.commit + " to origin/" + d.publish.branch + "."); }
    catch (e) { ui.busy = false; render(); toast(friendly(e.message), { bad: true }); }
  };
  out.push(h("h3", { text: "Send to GitHub" }), msg.el, h("div", { class: "actions" },
    h("button", { class: "btn", disabled: !ready, onclick: () => doPublish(true), text: "Preview (changes nothing)" }),
    ui.confirming === "publish"
      ? h("button", { class: "btn danger", onclick: () => { ui.confirming = null; if (!msg.get().trim()) { toast("Write a commit message first.", { bad: true }); return; } doPublish(false); }, text: "Yes, publish now" })
      : h("button", { class: "btn primary", disabled: !ready, onclick: () => { ui.confirming = "publish"; render(); }, text: "Publish" })));
  if (ui.publish) {
    const p = ui.publish;
    const text = p.status === "dry-run" ? "Preview. Nothing was changed. Would run:\n  " + p.commands.join("\n  ") : p.status === "nothing" ? "Nothing to publish." : "Published " + p.commit + " to origin/" + p.branch + ": " + (p.files.join(", ") || "earlier local commits");
    out.push(h("pre", { text: (p.pages.length ? "Pages rebuilt: " + p.pages.join(", ") + "\n" : "") + text }));
  }
  return out;
}

/* ================= main ================= */
function render() {
  const scroll = window.scrollY;
  renderChips(); renderRail();
  const panel = document.getElementById("panel");
  panel.replaceChildren();
  if (!state.config) {
    panel.append(h("h2", { text: "The config cannot be read" }), h("p", { class: "hint", text: "Fix site.config.json, then reload this page. Each problem is listed with its location." }), h("pre", { text: state.status.problems.join("\n") }));
    return;
  }
  panel.append(...{ home: renderHome, doors: renderDoors, stories: renderStories, blog: renderBlog, plans: renderPlans, github: renderGithub, publish: renderPublish }[ui.tab]());
  updateDirty();
  if (ui.focus) { const el = panel.querySelector('[data-fkey="' + ui.focus + '"]'); if (el) el.focus(); ui.focus = null; } else window.scrollTo(0, scroll);
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    const form = document.activeElement && document.activeElement.closest ? document.activeElement.closest("[data-saveform]") : null;
    if (form && form._save) form._save(); else toast("Click into a form first, then press Ctrl+S to save it.");
  }
});
document.getElementById("undo").addEventListener("click", undo);
document.getElementById("ptoggle").addEventListener("click", () => { ui.previewOpen = !ui.previewOpen; applyPreviewVisibility(); });

(async function start() {
  document.getElementById("statuses").append(...STATUSES.map(v => h("option", { value: v })));
  renderPreviewBar(); applyPreviewVisibility();
  try { await load(); render(); }
  catch (e) { document.getElementById("panel").append(h("h2", { text: "Cannot reach the manager" }), h("p", { text: e.message })); }
})();
</script>
