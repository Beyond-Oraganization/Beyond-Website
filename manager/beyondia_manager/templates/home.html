<!doctype html>
<html lang="en">
{{head}}
<body>
<div class="page">

  {{header}}

  <!-- Hero -->
  <section class="sec dark" aria-labelledby="hero-title" style="padding: clamp(48px, 6cqw, 88px) var(--px) clamp(64px, 7cqw, 104px); text-align: center">
    <div style="position: relative; width: min(400px, 78%); aspect-ratio: 1; margin: 0 auto">
      <svg class="rings" viewBox="0 0 2400 2400" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 2400px; height: 2400px; max-width: none; margin: -1200px 0 0 -1200px; pointer-events: none; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, #000 340px, transparent 900px); mask-image: radial-gradient(circle at 50% 50%, #000 0, #000 340px, transparent 900px)">
        <circle cx="1200" cy="1200" r="270" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"></circle>
        <circle cx="1200" cy="1200" r="282" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="14" stroke-dasharray="1.2 23.2"></circle>
        <circle cx="1200" cy="1200" r="390" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"></circle>
        <circle cx="1200" cy="1200" r="530" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"></circle>
        <circle cx="1200" cy="1200" r="690" fill="none" stroke="rgba(255,255,255,0.11)" stroke-width="1"></circle>
        <circle cx="1200" cy="1200" r="870" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"></circle>
        <g class="rays" transform="translate(1200 1200)" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="1 9">
          <path d="M0 -240V-1200"></path>
          <path d="M0 -240V-1200" transform="rotate(45)"></path>
          <path d="M0 -240V-1200" transform="rotate(90)"></path>
          <path d="M0 -240V-1200" transform="rotate(135)"></path>
          <path d="M0 -240V-1200" transform="rotate(180)"></path>
          <path d="M0 -240V-1200" transform="rotate(225)"></path>
          <path d="M0 -240V-1200" transform="rotate(270)"></path>
          <path d="M0 -240V-1200" transform="rotate(315)"></path>
        </g>
      </svg>
      <svg class="mark" viewBox="36 36 328 328" role="img" aria-label="Symbol of Beyondia: eight arrows converging on an eye" style="position: relative">
        <g class="arws" transform="translate(200 200)" fill="#D9D9D3">
          <g transform="rotate(0)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(45)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(90)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(135)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(180)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(225)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(270)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
          <g transform="rotate(315)"><path class="arw" d="M0 -38L16 -67L6 -63L0 -160L-6 -63L-16 -67Z"></path></g>
        </g>
        <g transform="translate(200 200) scale(1.25)" fill="none" stroke="#D9D9D3" stroke-width="2.2" stroke-linecap="round"><g class="eye">
          <path d="M-21 0Q0 -17 21 0Q0 17 -21 0Z"></path>
          <path d="M-24 -4Q0 -26 24 -4"></path>
          <circle r="7.5"></circle>
          <circle class="pupil" r="3.2" fill="#D9D9D3"></circle>
        </g></g>
      </svg>
    </div>

    <div class="hero-copy" style="position: relative; max-width: 880px; margin: 64px auto 0">
      <p class="kicker" style="justify-content: center">{{kicker}}</p>
      <h1 id="hero-title" class="display">{{title}}</h1>
      <p class="lead" style="max-width: 26em; margin: 32px auto 48px; color: #BDBDB7">{{lead}}</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px">
        {{buttons}}
      </div>
    </div>
  </section>

  {{ticker}}

  <!-- The map -->
  <section class="sec" aria-labelledby="map-title">
    <div class="rl" aria-hidden="true"></div><div class="rt" aria-hidden="true"></div>
    <svg class="rn" viewBox="-12 -7 24 14" width="24" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M-11 0Q0 -9 11 0Q0 9 -11 0Z"></path><circle r="3.4"></circle><circle r="1.3" fill="currentColor"></circle></g></svg>

    <div class="wrap">
      <div class="sec-head">
        <p class="kicker">{{map_kicker}}</p>
        <h2 id="map-title" class="h2">{{map_title}}</h2>
        <p class="p mute" style="margin-top: 24px">{{map_intro}}</p>
      </div>

      <div class="tiles">
        {{tiles}}
      </div>
    </div>
  </section>

  {{footer}}

</div>
</body>
</html>
