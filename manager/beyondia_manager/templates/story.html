<!doctype html>
<html lang="en">
{{head}}
<body>
<div class="page">

  {{header}}

  <main id="main" tabindex="-1">

  <section class="sec" aria-labelledby="page-title">
    <div class="rl" aria-hidden="true"></div><div class="rt" aria-hidden="true"></div>
    <svg class="rn" viewBox="-12 -7 24 14" width="24" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle r="6.2"></circle><path d="M-2.8 2.2Q0 3.8 2.8 2.2"></path></g><g fill="currentColor"><circle cx="-2.4" cy="-1.4" r="1.05"></circle><circle cx="2.4" cy="-1.4" r="1.05"></circle></g></svg>

    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><a href="stories.html">Stories</a><span class="sep">/</span><span class="here">{{title}}</span>
      </nav>

      <div class="sec-head">
        <ul class="pills" style="margin-bottom: 32px"><li class="pill">{{tag}}</li></ul>
        <h1 id="page-title" class="h1">{{title}}</h1>
      </div>

      <div class="g2">
        <div>
          <p class="label" style="margin-bottom: 8px; color: var(--mute)">{{kind}}</p>
          <p class="small mute">{{aside}}</p>
          <p class="small mute" style="margin-top: 12px">{{minutes}} min read</p>
        </div>
        <div class="story">
          {{body}}
        </div>
      </div>

      <div class="pager">
        {{pager}}
      </div>
    </div>
  </section>

  </main>

  {{footer}}

</div>
</body>
</html>
